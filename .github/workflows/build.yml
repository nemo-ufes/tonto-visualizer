name: build

on:
  push:
  pull_request:
  # The language is a pinned submodule, so drift shows up here rather than in a
  # wrong diagram: this run builds against whatever tontoredesign's main says now.
  schedule:
    - cron: '0 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The language is a private repository, and the automatic GITHUB_TOKEN is
      # scoped to this one, so it cannot clone the submodule: checkout stops on
      # a bare "Repository not found" that reads like the repository is gone.
      # Say what is actually missing before spending a runner on it.
      - if: ${{ !secrets.LANGUAGE_TOKEN }}
        run: |
          echo "::error::vendor/tontoredesign is private and the LANGUAGE_TOKEN secret is not set, so the submodule cannot be cloned. Set a token with read access to jpalmeida/tontoredesign as the LANGUAGE_TOKEN repository secret, or make that repository public and drop the secret from this workflow."
          exit 1
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Checkout persists this for the submodule clone and for the fetch the
          # scheduled run does below. Once tontoredesign is public, github.token
          # reaches it on its own and this line can go.
          token: ${{ secrets.LANGUAGE_TOKEN || github.token }}
      - if: github.event_name == 'schedule'
        run: git -C vendor/tontoredesign fetch origin main && git -C vendor/tontoredesign checkout origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run language
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # Rendering every example is the cheapest test there is of the whole
      # pipeline: a crash in layout or drawing fails the build rather than a
      # panel someone has open.
      - run: |
          for model in vendor/tontoredesign/examples/*/ vendor/tontoredesign/examples/*.tonto; do
            node packages/cli/bin/tonto-view.js "$model" --svg > /dev/null
          done
