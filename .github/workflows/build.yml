name: build

on:
  push:
  pull_request:
  # The language is a pinned submodule, so drift shows up here rather than in a
  # wrong diagram: this run builds against whatever tontoredesign's main says now.
  schedule:
    - cron: '0 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - if: github.event_name == 'schedule'
        run: git -C vendor/tontoredesign fetch origin main && git -C vendor/tontoredesign checkout origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run language
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # Rendering every example is the cheapest test there is of the whole
      # pipeline: a crash in layout or drawing fails the build rather than a
      # panel someone has open.
      - run: |
          for model in vendor/tontoredesign/examples/*/ vendor/tontoredesign/examples/*.tonto; do
            node packages/cli/bin/tonto-view.js "$model" --svg > /dev/null
          done
